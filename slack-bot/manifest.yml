# Create the app at https://api.slack.com/apps -> "Create New App" -> "From an app manifest".
display_information:
  name: DevRel Issues
  description: Raise GitHub issues in 169Pi/devrel using the repo's issue templates.
  background_color: "#24292f"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: DevRel Issues
    always_online: true
  slash_commands:
    - command: /devrel-issue
      description: Raise a GitHub issue from a 169Pi/devrel template
      usage_hint: "[merch | showcase | help | or describe the issue]"
      should_escape: false
  shortcuts:
    - name: Raise a GitHub issue
      type: global
      callback_id: raise_github_issue
      description: File an issue in 169Pi/devrel using its issue templates
    - name: Turn into GitHub issue
      type: message
      callback_id: issue_from_message
      description: Alpie drafts a 169Pi/devrel issue from this message and its thread
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - users:read
      # Read threads for the "Turn into GitHub issue" message shortcut
      - channels:history
      - groups:history
      - im:history
      - mpim:history
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
